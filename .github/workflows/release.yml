name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run package-release

      - name: Attest Obsidian release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/release/checksums.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --json tagName >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists; refusing to create a competing release. Resolve it and re-run."
            exit 1
          fi
          draft_url="$(gh release create "${RELEASE_TAG}" --verify-tag --title "${RELEASE_TAG}" --generate-notes --draft dist/release/main.js dist/release/manifest.json dist/release/styles.css | tail -n 1)"

          # GitHub gives unpublished drafts an untagged-* preview URL even when
          # their tag_name is correct. Verify the release metadata instead.
          release_state="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | [.id, .tag_name, .draft] | @tsv")"
          if [[ -z "${release_state}" || "${release_state}" == *$'\n'* ]]; then
            echo "::error::Expected exactly one draft release for ${RELEASE_TAG}."
            exit 1
          fi
          IFS=$'\t' read -r release_id actual_tag is_draft <<< "${release_state}"
          if [[ -z "${release_id}" || "${actual_tag}" != "${RELEASE_TAG}" || "${is_draft}" != "true" ]]; then
            echo "::error::Created release metadata is invalid: id=${release_id}, tag=${actual_tag}, draft=${is_draft}."
            exit 1
          fi
          echo "Draft release ${release_id} verified for tag ${actual_tag}: ${draft_url}"
