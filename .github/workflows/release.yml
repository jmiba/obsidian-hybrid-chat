name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run package-release

      - name: Attest Obsidian release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/release/checksums.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" --json tagName >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists; refusing to create a competing release. Resolve it and re-run."
            exit 1
          fi
          actual_url="$(gh release create "${RELEASE_TAG}" --verify-tag --title "${RELEASE_TAG}" --generate-notes --draft dist/release/main.js dist/release/manifest.json dist/release/styles.css | tail -n 1)"
          if [[ "${actual_url%/}" != "${expected_url}" ]]; then
            echo "::error::Expected ${expected_url} but got ${actual_url}; the release is not attached to tag ${RELEASE_TAG}."
            exit 1
          fi
          echo "Draft release attached to tag: ${actual_url}"
